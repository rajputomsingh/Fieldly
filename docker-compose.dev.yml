services:
  fieldly-app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_WEBPACK_USEPOLLING: "1"

    ports:
      - "3000:3000"

    volumes:
      - .:/app:delegated
      - /app/node_modules
      - /app/.next

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fieldly

    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fieldly"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    volumes:
      - redis_data_dev:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

volumes:
  postgres_data_dev:
  redis_data_dev: